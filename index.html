<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dev-Onix Wrestling — API Test</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; padding: 16px; }
  h1 { font-size: 18px; }
  section { background: #1c1c1c; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #9cf; }
  input { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; box-sizing: border-box; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #3b82f6; color: white; font-weight: bold; margin-bottom: 6px; }
  button:active { background: #2563eb; }
  pre { white-space: pre-wrap; word-break: break-word; background: #000; padding: 10px; border-radius: 6px; font-size: 12px; max-height: 200px; overflow-y: auto; }
  .token-box { font-size: 11px; color: #8f8; word-break: break-all; margin-top: 6px; }
</style>
</head>
<body>
<h1>🤼 Dev-Onix Wrestling — API Test Console</h1>

<section>
  <h2>1. Register</h2>
  <input id="reg-email" placeholder="email" value="test@example.com" />
  <input id="reg-password" placeholder="password (8+ chars)" value="testpass123" />
  <button onclick="register()">Register</button>
</section>

<section>
  <h2>2. Login</h2>
  <input id="login-email" placeholder="email" value="test@example.com" />
  <input id="login-password" placeholder="password" value="testpass123" />
  <button onclick="login()">Login</button>
</section>

<section>
  <h2>3. Get Profile (needs token from above)</h2>
  <button onclick="getProfile()">GET /api/profile</button>
</section>

<div class="token-box" id="token-display">No token yet</div>
<pre id="output">Result দেখাবে এখানে...</pre>

<script>
let currentToken = null;

function show(data) {
  document.getElementById('output').textContent = JSON.stringify(data, null, 2);
}

async function register() {
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'register', email, password })
  });
  const data = await res.json();
  show({ status: res.status, ...data });
  if (data.token) {
    currentToken = data.token;
    document.getElementById('token-display').textContent = 'Token saved: ' + data.token.slice(0, 30) + '...';
  }
}

async function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'login', email, password })
  });
  const data = await res.json();
  show({ status: res.status, ...data });
  if (data.token) {
    currentToken = data.token;
    document.getElementById('token-display').textContent = 'Token saved: ' + data.token.slice(0, 30) + '...';
  }
}

async function getProfile() {
  if (!currentToken) {
    show({ error: 'আগে Register বা Login করে টোকেন নিন' });
    return;
  }
  const res = await fetch('/api/profile', {
    headers: { 'Authorization': 'Bearer ' + currentToken }
  });
  const data = await res.json();
  show({ status: res.status, ...data });
}
</script>
</body>
</html>
